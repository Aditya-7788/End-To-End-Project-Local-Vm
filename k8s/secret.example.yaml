apiVersion: v1
kind: Secret
metadata:
  name: careflow-secrets
  namespace: careflow
type: Opaque
stringData:
  POSTGRES_DB: "REPLACE_WITH_DATABASE_NAME"
  POSTGRES_USER: "REPLACE_WITH_DATABASE_USER"
  POSTGRES_PASSWORD: "REPLACE_WITH_A_RANDOM_DATABASE_PASSWORD"
  DATABASE_URL: "postgres://REPLACE_WITH_DATABASE_USER:REPLACE_WITH_A_RANDOM_DATABASE_PASSWORD@careflow-postgres:5432/REPLACE_WITH_DATABASE_NAME"
  JWT_SECRET: "REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
  GEMINI_API_KEY: ""
