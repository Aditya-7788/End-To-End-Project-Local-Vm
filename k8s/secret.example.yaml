apiVersion: v1
kind: Secret
metadata:
  name: careflow-secrets
  namespace: careflow
type: Opaque
stringData:
  DATABASE_URL: "postgres://careflow:REPLACE_WITH_DATABASE_PASSWORD@careflow-postgres:5432/careflow"
  POSTGRES_PASSWORD: "REPLACE_WITH_A_RANDOM_DATABASE_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
  GEMINI_API_KEY: ""
