apiVersion: v1
kind: ConfigMap
metadata:
  name: careflow-config
  namespace: careflow
data:
  NODE_ENV: production
  PORT: "3000"
  CORS_ORIGIN: "http://careflow.internal"
  DB_POOL_SIZE: "10"
  LLM_MODEL: "claude-3-5-haiku-latest"
  BACKEND_HOST: "careflow-backend"
  NGINX_ENVSUBST_FILTER: "^BACKEND_HOST$"
