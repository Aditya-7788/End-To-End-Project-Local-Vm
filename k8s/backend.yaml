apiVersion: apps/v1
kind: Deployment
metadata:
  name: careflow-backend
  namespace: careflow
  labels:
    app: careflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: careflow-backend
  template:
    metadata:
      labels:
        app: careflow-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: careflow-backend
          image: <ACR_NAME>.azurecr.io/careflow-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: careflow-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: careflow-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: careflow-secrets
                  key: JWT_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: careflow-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: careflow-backend
  namespace: careflow
spec:
  type: ClusterIP
  selector:
    app: careflow-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: careflow-backend
  namespace: careflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: careflow-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
