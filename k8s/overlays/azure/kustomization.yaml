apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  # The workflow supplies the ACR name and commit-specific tags.
  - name: careflow-backend
  - name: careflow-frontend

patches:
  - target:
      version: v1
      kind: Service
      name: careflow-frontend
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: careflow-frontend
      spec:
        type: LoadBalancer
