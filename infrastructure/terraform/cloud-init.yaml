#cloud-config
write_files:
  - path: /usr/local/sbin/bootstrap-runner.sh
    owner: root:root
    permissions: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      exec > >(tee -a /var/log/runner-bootstrap.log) 2>&1
      echo "Starting GitHub Actions runner bootstrap at $(date --iso-8601=seconds)"
      export DEBIAN_FRONTEND=noninteractive

      apt-get update
      apt-get install -y ca-certificates curl gnupg lsb-release jq unzip git cron apt-transport-https software-properties-common

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list

      curl -fsSL https://deb.nodesource.com/setup_20.x -o /tmp/nodesource_setup.sh
      bash /tmp/nodesource_setup.sh
      rm -f /tmp/nodesource_setup.sh

      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin nodejs
      curl -sL https://aka.ms/InstallAzureCLIDeb | bash
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      if ! id github-runner >/dev/null 2>&1; then
        useradd --create-home --shell /bin/bash github-runner
      fi
      passwd --lock github-runner
      usermod -aG docker github-runner

      mkdir -p /opt/actions-runner
      chown github-runner:github-runner /opt/actions-runner
      runner_version='${runner_version}'
      if [ "$runner_version" = "latest" ]; then
        runner_release_json=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest)
        runner_download_url=$(printf '%s' "$runner_release_json" | jq -r '.assets[] | select(.name | startswith("actions-runner-linux-x64-") and endswith(".tar.gz")) | .browser_download_url' | head -n 1)
        if [ -z "$runner_download_url" ] || [ "$runner_download_url" = "null" ]; then
          echo "Could not find the latest Linux x64 GitHub Actions runner release asset." >&2
          exit 1
        fi
      else
        runner_version=$(printf '%s' "$runner_version" | sed 's/^v//')
        runner_download_url="https://github.com/actions/runner/releases/download/v$runner_version/actions-runner-linux-x64-$runner_version.tar.gz"
      fi

      curl -fL "$runner_download_url" -o /tmp/actions-runner-linux-x64.tar.gz
      tar -xzf /tmp/actions-runner-linux-x64.tar.gz -C /opt/actions-runner
      rm -f /tmp/actions-runner-linux-x64.tar.gz
      chown -R github-runner:github-runner /opt/actions-runner
      /opt/actions-runner/bin/installdependencies.sh

      az aks install-cli --install-location /usr/local/bin/kubectl --kubelogin-install-location /usr/local/bin/kubelogin
      chmod 0755 /usr/local/bin/kubectl /usr/local/bin/kubelogin

      cat > /etc/cron.d/docker-prune <<'CRON'
      0 3 * * 0 root /usr/bin/docker system prune -af --filter "until=168h" >> /var/log/docker-prune.log 2>&1
      CRON
      chmod 0644 /etc/cron.d/docker-prune
      systemctl enable --now docker
      systemctl enable --now cron
      echo "Runner bootstrap completed at $(date --iso-8601=seconds)"

  - path: /usr/local/bin/register-runner.sh
    owner: root:root
    permissions: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      if [ "$(id -u)" -ne 0 ]; then
        echo "Run this helper with sudo and provide a repository URL." >&2
        exit 1
      fi

      if [ "$#" -ne 1 ]; then
        echo "Usage: sudo register-runner.sh REPOSITORY_URL" >&2
        exit 2
      fi

      repository_url=$1
      if [ -f /opt/actions-runner/.runner ]; then
        echo "The GitHub Actions runner is already configured." >&2
        exit 1
      fi

      read -r -s -p "Short-lived GitHub runner registration token: " registration_token
      printf '\n'
      if [ -z "$registration_token" ]; then
        echo "A non-empty registration token is required." >&2
        exit 1
      fi

      printf '%s\n' "$registration_token" | runuser -u github-runner -- /bin/bash -c '
        set -euo pipefail
        read -r registration_token
        cd /opt/actions-runner
        ./config.sh --url "$1" --token "$registration_token" --unattended --labels azure,docker
      ' register-runner "$repository_url"
      unset registration_token

      cd /opt/actions-runner
      ./svc.sh install github-runner
      ./svc.sh start
      echo "Runner registered and started. Check with: systemctl status 'actions.runner.*'"

runcmd:
  - [bash, -c, "/usr/local/sbin/bootstrap-runner.sh"]
