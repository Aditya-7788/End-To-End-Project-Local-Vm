name: Azure self-hosted runner CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test, build, scan, and push
    runs-on: [self-hosted, linux, azure, docker]
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set container image name
        run: |
          if [ -z "$ACR_NAME" ]; then
            echo "Set the ACR_NAME repository variable." >&2
            exit 1
          fi
          image_repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${ACR_NAME}.azurecr.io/${image_repository}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sign in with the runner managed identity
        run: az login --identity

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build container image
        run: docker build --tag "$IMAGE" .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            "$IMAGE"

      - name: Push image to Azure Container Registry
        run: docker push "$IMAGE"

  cd:
    name: Deploy to private AKS
    needs: ci
    runs-on: [self-hosted, linux, azure, docker]
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      AKS_NAME: ${{ vars.AKS_NAME }}
      AKS_RG: ${{ vars.AKS_RG }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      DEPLOYMENT: ${{ vars.DEPLOYMENT }}
      CONTAINER: ${{ vars.CONTAINER }}
    steps:
      - name: Set container image name
        run: |
          if [ -z "$ACR_NAME" ]; then
            echo "Set the ACR_NAME repository variable." >&2
            exit 1
          fi
          image_repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${ACR_NAME}.azurecr.io/${image_repository}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Sign in with the runner managed identity
        run: az login --identity

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "$AKS_RG" --name "$AKS_NAME" --overwrite-existing

      - name: Configure kubectl for Azure CLI authentication
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Update deployment image
        run: kubectl set image "deployment/$DEPLOYMENT" "$CONTAINER=$IMAGE" --namespace "$K8S_NAMESPACE"

      - name: Wait for rollout
        run: kubectl rollout status "deployment/$DEPLOYMENT" --namespace "$K8S_NAMESPACE" --timeout=5m
